[book]
title = "笨办法学 Agent · Learn Agent the Hard Way"
description = "《笨办法学 Agent：从 60 行代码到一个完整的 harness》。从一次 API 调用开始，亲手写出一个能跑工具循环、subagent、MCP、沙箱和浏览器的 agent harness。"
authors = ["Roy Lei"]
language = "zh-CN"
src = "src"

[preprocessor.tabs]

[output.html]
git-repository-url = "https://github.com/Leihb/learn-agent-the-hard-way"
edit-url-template = "https://github.com/Leihb/learn-agent-the-hard-way/edit/main/{path}"
default-theme = "rust"
preferred-dark-theme = "navy"
additional-css = ["theme/tabs.css"]
additional-js = ["theme/tabs.js"]

[output.html.fold]
enable = true
level = 0
